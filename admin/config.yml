
backend:
  name: github
  repo: persianworld/persianworld.github.io
  branch: main
  base_url: https://sveltia-cms-auth.yektakord7.workers.dev

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "lessons"
    label: "درس‌ها"
    folder: "lessons"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان درس"
        name: "title"
        widget: "string"
      - label: "متن درس"
        name: "body"
        widget: "markdown"
