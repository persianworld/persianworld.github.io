
backend:
  name: github
  repo: persianworld/persianworld.github.io
  branch: main
  base_url: https://sveltia-cms-auth.yektakord7.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "lessons"
    label: "درس‌ها"
    folder: "lessons"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان درس"
        name: "title"
        widget: "string"
      - label: "خلاصهٔ درس"
        name: "description"
        widget: "text"
        required: false
      - label: "ترتیب نمایش"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "متن درس"
        name: "body"
        widget: "markdown"
